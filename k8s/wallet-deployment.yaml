apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-service

  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
        - name: wallet
          image: identity-service-wallet-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
              protocol: TCP