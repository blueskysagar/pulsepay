services: # what are the things i needed to run this application
  postgres:
    image: postgres:17
    container_name: pulsepay-postgres

    environment: # I want postgres to use this settings when it starts
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432" # if local machine wants to communicate with postgres container we use that port

    volumes:
      - postgres-data:/var/lib/postgresql/data # stores database values here

    healthcheck:     # to know whether the container is healthy
      test: ["CMD-SHELL" , "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"] # CMD-SHELl: run this command through the shell
                                                                  # is the postgressql server ready to accept the connections for the pulsepay database using postgres user
      interval: 10s # run healthy checks every 10sec.
      timeout: 5s #if health check doesnt respond within 5 seconds consider that check failed.
      retries: 5 # retry 5 times before considering the container unhealthy.

  # REDIS
  redis:
    image: redis:8.10.2
    container_name: pulsepay-redis
# we write our settings in redis/redis.conf in our laptop, redis container does not see this config or rules so the volumes below work as usb drive which , it copies from our laptop file to the container , so command section
    # tells turn on the redis using redis-server, read the file which we just plugged in and lock it with password.
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD","redis-cli", "-a", "${REDIS_PASSWORD}", "ping"] #run this command into container
      interval: 10s # wait 10sec between each health test
      timeout: 5s # fail the test if the redis doesnt reply.
      retries: 5 # mark container as unhealthy if test fails 5 times in a row.
      start_period: 5s # give this container some time to start up before you start punishing it for failing health checks.

      # ============================================================
      # KAFKA CONTROLLER 1
      # ============================================================
  kafka-controller-1:
    image: apache/kafka:4.2.1
    container_name: pulsepay-kafka-controller-1
    hostname: kafka-controller-1

    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_CONTROLLER_QUORUM_VOTERS:
        1@kafka-controller-1:9093,
        2@kafka-controller-2:9093,
        3@kafka-controller-3:9093
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data # The folder path inside the container where Kafka writes its cluster management logs and state files.
    volumes:
      - kafka-controller-1-data:/var/lib/kafka/data # Persists the controller's internal state on your host machine so cluster metadata isn't lost if containers stop or restart.

    # ============================================================
    # KAFKA CONTROLLER 2
    # ============================================================

  kafka-controller-2:
      image: apache/kafka:4.2.1
      container_name: pulsepay-kafka-controller-2
      hostname: kafka-controller-2

      environment:
        CLUSTER_ID: ${KAFKA_CLUSTER_ID}

        KAFKA_NODE_ID: 2
        KAFKA_PROCESS_ROLES: controller

        KAFKA_CONTROLLER_QUORUM_VOTERS: >-
          1@kafka-controller-1:9093,
          2@kafka-controller-2:9093,
          3@kafka-controller-3:9093

        KAFKA_LISTENERS: CONTROLLER://:9093

        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

        KAFKA_LOG_DIRS: /var/lib/kafka/data

      volumes:
        - kafka-controller-2-data:/var/lib/kafka/data

  kafka-controller-3:
    image: apache/kafka:4.2.1
    container_name: pulsepay-kafka-controller-3
    hostname: kafka-controller-3

    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka-controller-1:9093,
        2@kafka-controller-2:9093,
        3@kafka-controller-3:9093

      KAFKA_LISTENERS: CONTROLLER://:9093

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-controller-3-data:/var/lib/kafka/data

    # ============================================================
    # KAFKA BROKER 1
    # ============================================================
  kafka-broker-1:
    image: apache/kafka:4.2.1
    container_name: pulsepay-kafka-broker-1
    hostname: kafka-broker-1
    ports:
      - "29092:9092" # Host port is local machine and container port is docker container

    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID} #Id card of kafka cluster

      KAFKA_NODE_ID: 4 #Which Kafka node inside that cluster?
      KAFKA_PROCESS_ROLES: broker

      KAFKA_CONTROLLER_QUORUM_VOTERS: >- #"These are the controllers that participate in the KRaft controller quorum."
          1@kafka-controller-1:9093,
          2@kafka-controller-2:9093,
          3@kafka-controller-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092 # "Kafka should actually open these ports inside the container."

      KAFKA_ADVERTISED_LISTENERS: >- #What address Kafka tells clients to use.
          PLAINTEXT://kafka-broker-1:19092,
          PLAINTEXT_HOST://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >- # These listeners are using plaintext no encrytpion
          CONTROLLER:PLAINTEXT,
          PLAINTEXT:PLAINTEXT,
          PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT #"When brokers communicate with other brokers, use the PLAINTEXT listener."

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /var/lib/kafka/data # store kafka data here
      KAFKA_OFFSET_TOPIC_REPLICATION_FACTOR: 3 # KAFKA WANTS 3 COPIES ACROSS THE BROKEN SO WHEN ONE DIES DATA ISNT LOST.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3 # SAYING REPLICATION IS 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 # OUT OF 3 AT LEAST 2 REPLICA MUST BE HEALTHY OTHERWISE KAFKA DOES NOT ACCEPT CERTAIN WRITES
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false" #"I would rather temporarily lose availability than elect a stale replica and risk losing acknowledged data."


    volumes:
      - kafka-broker-1-data:/var/lib/kafka/data
    depends_on:
      - kafka-controller-1
      - kafka-controller-2
      - kafka-controller-3

    # ============================================================
    # KAFKA BROKER 2
    # ============================================================

  kafka-broker-2:
      image: apache/kafka:4.2.1
      container_name: pulsepay-kafka-broker-2
      hostname: kafka-broker-2

      ports:
        - "39092:9092"

      environment:
        CLUSTER_ID: ${KAFKA_CLUSTER_ID}

        KAFKA_NODE_ID: 5
        KAFKA_PROCESS_ROLES: broker

        KAFKA_CONTROLLER_QUORUM_VOTERS: >-
          1@kafka-controller-1:9093,
          2@kafka-controller-2:9093,
          3@kafka-controller-3:9093

        KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092

        KAFKA_ADVERTISED_LISTENERS: >-
          PLAINTEXT://kafka-broker-2:19092,
          PLAINTEXT_HOST://localhost:39092

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
          CONTROLLER:PLAINTEXT,
          PLAINTEXT:PLAINTEXT,
          PLAINTEXT_HOST:PLAINTEXT

        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

        KAFKA_LOG_DIRS: /var/lib/kafka/data

        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

        KAFKA_MIN_INSYNC_REPLICAS: 2

        KAFKA_DEFAULT_REPLICATION_FACTOR: 3

        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

        KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"

      volumes:
        - kafka-broker-2-data:/var/lib/kafka/data

      depends_on:
        - kafka-controller-1
        - kafka-controller-2
        - kafka-controller-3


    # ============================================================
    # KAFKA BROKER 3
    # ============================================================

  kafka-broker-3:
      image: apache/kafka:4.2.1
      container_name: pulsepay-kafka-broker-3
      hostname: kafka-broker-3

      ports:
        - "49092:9092"

      environment:
        CLUSTER_ID: ${KAFKA_CLUSTER_ID}

        KAFKA_NODE_ID: 6
        KAFKA_PROCESS_ROLES: broker

        KAFKA_CONTROLLER_QUORUM_VOTERS: >-
          1@kafka-controller-1:9093,
          2@kafka-controller-2:9093,
          3@kafka-controller-3:9093

        KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092

        KAFKA_ADVERTISED_LISTENERS: >-
          PLAINTEXT://kafka-broker-3:19092,
          PLAINTEXT_HOST://localhost:49092

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
          CONTROLLER:PLAINTEXT,
          PLAINTEXT:PLAINTEXT,
          PLAINTEXT_HOST:PLAINTEXT

        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

        KAFKA_LOG_DIRS: /var/lib/kafka/data

        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3 #Consumer Bookmarks (Where you are reading)

        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3 #Transaction Ledgers (How you are writing)

        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

        KAFKA_MIN_INSYNC_REPLICAS: 2

        KAFKA_DEFAULT_REPLICATION_FACTOR: 3 # make 3 copies of each topic and puts 1 copy on each of your 3 brokers.

        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

        KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"

      volumes:
        - kafka-broker-3-data:/var/lib/kafka/data

      depends_on:
        - kafka-controller-1
        - kafka-controller-2
        - kafka-controller-3


  identity-service:
    build:
      context: .  # Build identity service image using docker file in the current project directory
      dockerfile: Dockerfile
      args:
        MODULE: identity-service   # Tells the Dockerfile: "build THIS module"
    container_name: pulsepay-identity-service

    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

    ports:  # exposing this port to the outside world
      - "8080:8080"
    depends_on:  # start identity service only after postgresql service reports healthy
      postgres:
        condition: service_healthy


  wallet-service:
    # Build wallet service image using its docker file
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: wallet-service     # Tells the Dockerfile: "build THIS module instead"


    container_name: pulsepay-wallet-service

    environment:
      #Postgresql connection
      SPRING_DATASOURCE_URL:  ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME:  ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD:  ${SPRING_DATASOURCE_PASSWORD}

    # Redis connection.
    # "redis" is the Docker Compose service name.
      SPRING_DATA_REDIS_HOST:  redis
      # Redis listens on port 6379 inside its container.
      SPRING_DATA_REDIS_PORT:  6379

    # Same password used by the Redis container.
      REDIS_PASSWORD:  ${REDIS_PASSWORD}

    ports:
        - "8082:8082"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
          condition: service_healthy


    # PAYMENT SERVICE
  payment-service:
      build:
        context: .
        dockerfile: Dockerfile
        args:
          MODULE: payment-service

      container_name: pulsepay-payment-service
      restart: unless-stopped

      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
        SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
        SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

        SERVER_PORT: 8082

        PULSEPAY_WALLET_SERVICE_URL: http://wallet-service:8082
        PULSEPAY_JWT_PUBLIC_KEY: ${PULSEPAY_JWT_PUBLIC_KEY}
        PULSEPAY_INTERNAL_SERVICE_TOKEN: ${PULSEPAY_INTERNAL_SERVICE_TOKEN:-}

      ports:
        - "8084:8082"

      depends_on:
        postgres:
          condition: service_healthy
        wallet-service:
          condition: service_started


  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification-service

    container_name: pulsepay-notification-service
    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      SERVER_PORT: 8083

      KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:19092,kafka-broker-2:19092,kafka-broker-3:19092

      JWT_PUBLIC_KEY: ${PULSEPAY_JWT_PUBLIC_KEY}
      JWT_ISSUER: pulsepay_identity_service

    ports:
      - "8083:8083"

    depends_on:
      postgres:
        condition: service_healthy
      kafka-broker-1:
        condition: service_started
      kafka-broker-2:
        condition: service_started
      kafka-broker-3:
        condition: service_started

volumes:  # storing the data or database values outside container so that even-though the container is dead data is still alive.

      postgres-data:

      kafka-controller-1-data:
      kafka-controller-2-data:
      kafka-controller-3-data:

      kafka-broker-1-data:
      kafka-broker-2-data:
      kafka-broker-3-data:
      redis-data:
