#redis listens on this port later wallet service will connect to this port
port 6379
#Preserves fast-changing Redis state (sessions, rate limits) on reboot & prevents PostgreSQL overload on restart
appendonly yes
#This controls how frequently redis asks the OS to flush AOF buffered data to disk.
appendfsync everysec
#maximum memory redis should have for its dataset.
maxmemory 256mb
# When redis reaches its memory limit , evict less recently used keys from available dataset.
maxmemory-policy allkeys-lru

# We can say that wallet service runs in separate container and redis in separate container
# When wallet service wants to connect with redis it does via redis hostname, spring boot read the
#redis connection properties , then spring data is the manager who manages what to send and translate
#java to redis bytes. Spring client or lettuce opens tcp connections or create over the network