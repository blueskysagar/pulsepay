name: PulsePay CI
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
jobs:
  build-and-verify:
    name: Build and Verify Pulsepay
    runs-on: ubuntu-latest

    env:
      PULSEPAY_JWT_PRIVATE_KEY: ${{ secrets.PULSEPAY_JWT_PRIVATE_KEY }}
      PULSEPAY_JWT_PUBLIC_KEY: ${{ secrets.PULSEPAY_JWT_PUBLIC_KEY }}
      PULSEPAY_JWT_ISSUER: pulsepay_identity_service

    steps:
      # Step 1: Download our repository source code onto the runner.
      - name: Checkout source code
        uses: actions/checkout@v7
      # Step 2: Install Java 21 and configure Maven dependency caching.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
            distribution: temurin
            java-version: '21'
            cache: maven

      # Step 3: Build all Maven modules and execute verification.
      - name: Build and verify
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

  build-and-publish:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: build-and-verify
    #build docker images and publish them.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - module: identity-service
            image: pulsepay-identity-service
          - module: wallet-service
            image: pulsepay-wallet-service
          - module: payment-service
            image: pulsepay-payment-service
          - module: notification-service
            image: pulsepay-notification-service

    steps:
        - name: Checkout source code
          uses: actions/checkout@v7
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
          # BuildX is new docker build enginer that can use caching and run faster
        - name: Log in to Github Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Generate Docker image tabs
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
            tags: |
              type=sha
              type=raw,value=latest,enable={{is_default_branch}}
            # Give each image its GHCR address, tag with commit SHA, and mark as latest only on main branch.

        - name: Build and push Docker image
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            build-args: |
              MODULE=${{ matrix.module }}
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

             # JOB 3: Ask the private deployment repository to deploy the new Wallet image.
  trigger-wallet-deployment:
    name: Trigger Wallet Deployment
    runs-on: ubuntu-latest

    needs: build-and-publish

    # Only deploy after a push to the main branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Generate immutable image tag
        id: image
        shell: bash
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Deployment image tag: ${IMAGE_TAG}"

      - name: Trigger private deployment workflow
        env:
          DEPLOYER_TOKEN: ${{ secrets.DEPLOYER_TOKEN }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/blueskysagar/pulsepay-deployer/actions/workflows/deploy-wallet.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DEPLOYER_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "{\"ref\":\"main\",\"inputs\":{\"image_tag\":\"${IMAGE_TAG}\"}}"

          echo "Wallet deployment workflow successfully dispatched."









